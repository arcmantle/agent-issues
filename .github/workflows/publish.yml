name: Pnpm Publish

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    env:
      AGENT_ISSUES_TEST_PG_URL: postgres://agent_issues:agent_issues_dev_only@127.0.0.1:5433/agent_issues
      AGENT_ISSUES_TEST_PG_APP_URL: postgres://agent_issues_app:agent_issues_app_dev_only@127.0.0.1:5433/agent_issues
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agent_issues
          POSTGRES_PASSWORD: agent_issues_dev_only
          POSTGRES_DB: agent_issues
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U agent_issues -d agent_issues"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies.
        run: pnpm install

      - name: Initialize PostgreSQL application role.
        run: >-
          docker run --rm --network host
          --volume "$PWD/docker/postgres-init:/docker-entrypoint-initdb.d:ro"
          postgres:16-alpine
          psql "$AGENT_ISSUES_TEST_PG_URL"
          --set ON_ERROR_STOP=1
          --file /docker-entrypoint-initdb.d/01-app-role.sql

      - name: Typecheck project.
        run: pnpm typecheck

      - name: Build test assets.
        run: pnpm --filter @agent-issues/site build && pnpm --filter @agent-issues/kanban build

      - name: Test project.
        run: pnpm --workspace-concurrency=1 -r test

      - name: Calculate version with Prospector
        id: version
        uses: arcmantle/prospector@main
        with:
          dir: '.'

      - name: Set package version
        run: |
          echo "Setting packages/cli version to ${{ steps.version.outputs.version }}"
          npm version ${{ steps.version.outputs.version }} --no-git-tag-version --prefix packages/cli

      - name: Build project.
        run: pnpm build

      - name: Verify package versions
        run: |
          actual=$(node -p "require('./packages/cli/package.json').version")
          test "$actual" = "${{ steps.version.outputs.version }}"

      - name: Publish MCP package to NPM
        if: github.event_name == 'push'
        run: |
          version=$(node -p "require('./packages/mcp-server/package.json').version")
          if ! npm view "agent-issues-mcp@$version" version >/dev/null 2>&1; then
            pnpm --dir packages/mcp-server publish --access public --no-git-checks
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH }}
          NPM_TOKEN: ${{ secrets.NPM_PUBLISH }}

      - name: Publish CLI package to NPM
        if: github.event_name == 'push'
        run: pnpm --dir packages/cli publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH }}
          NPM_TOKEN: ${{ secrets.NPM_PUBLISH }}
