name: Pnpm Publish

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies.
        run: pnpm install

      - name: Typecheck project.
        run: pnpm typecheck

      - name: Test project.
        run: pnpm --workspace-concurrency=1 -r test

      - name: Calculate version with Prospector
        id: version
        uses: arcmantle/prospector@main
        with:
          dir: '.'

      - name: Set package version
        run: |
          echo "Setting packages/cli version to ${{ steps.version.outputs.version }}"
          npm version ${{ steps.version.outputs.version }} --no-git-tag-version --prefix packages/cli

      - name: Build project.
        run: pnpm build

      - name: Verify package versions
        run: |
          actual=$(node -p "require('./packages/cli/package.json').version")
          test "$actual" = "${{ steps.version.outputs.version }}"

      - name: Publish MCP package to NPM
        if: github.event_name == 'push'
        run: |
          version=$(node -p "require('./packages/mcp-server/package.json').version")
          if ! npm view "agent-issues-mcp@$version" version >/dev/null 2>&1; then
            pnpm --dir packages/mcp-server publish --access public --no-git-checks
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH }}
          NPM_TOKEN: ${{ secrets.NPM_PUBLISH }}

      - name: Publish CLI package to NPM
        if: github.event_name == 'push'
        run: pnpm --dir packages/cli publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH }}
          NPM_TOKEN: ${{ secrets.NPM_PUBLISH }}
