services:
  postgres:
    image: postgres:16-alpine
    container_name: agent-issues-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agent_issues
      POSTGRES_PASSWORD: agent_issues_dev_only
      POSTGRES_DB: agent_issues
    ports:
      - "5433:5432"
    volumes:
      - agent-issues-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro

  cloudbeaver:
    image: dbeaver/cloudbeaver:24
    container_name: agent-issues-local-cloudbeaver
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      CB_SERVER_NAME: agent-issues-local
      CB_ADMIN_NAME: agent_issues_admin
      CB_ADMIN_PASSWORD: agent_issues_dev_only
      CLOUDBEAVER_APP_GRANT_CONNECTIONS_ACCESS_TO_ANONYMOUS_TEAM: "true"
    ports:
      - "8978:8978"
    volumes:
      - agent-issues-cloudbeaver-workspace:/opt/cloudbeaver/workspace
      - ./docker/cloudbeaver/initial-data-sources.conf:/opt/cloudbeaver/conf/initial-data-sources.conf:ro

volumes:
  agent-issues-postgres-data:
  agent-issues-cloudbeaver-workspace:
